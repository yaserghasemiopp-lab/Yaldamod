name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build APK (Release)
        run: ./gradlew assembleRelease --stacktrace --info 2>&1 | tee build-log.txt
        env:
          TESHINE_KEYSTORE_PASSWORD: ${{ secrets.TESHINE_KEYSTORE_PASSWORD }}
          TESHINE_KEY_PASSWORD: ${{ secrets.TESHINE_KEY_PASSWORD }}
          TESHINE_KEY_ALIAS: ${{ secrets.TESHINE_KEY_ALIAS }}
          TESHINE_KEYSTORE_BASE64: ${{ secrets.TESHINE_KEYSTORE_BASE64 }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/**/*.apk
