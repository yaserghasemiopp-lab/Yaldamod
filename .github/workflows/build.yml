name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant permission
        run: chmod +x gradlew
        
      - name: Decode Keystore
        run: echo "${{ secrets.TESHINE_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/keystore.jks

      - name: Build APK (Release)
        run: ./gradlew assembleRelease
        env:
          TESHINE_KEYSTORE_PASSWORD: ${{ secrets.TESHINE_KEYSTORE_PASSWORD }}
          TESHINE_KEY_PASSWORD: ${{ secrets.TESHINE_KEY_PASSWORD }}
          TESHINE_KEY_ALIAS: ${{ secrets.TESHINE_KEY_ALIAS }}
          TESHINE_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
